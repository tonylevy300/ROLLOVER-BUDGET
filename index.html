<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PS5 Savings Tracker | Simple</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #070a12; 
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }

        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Prevent zooming on iOS inputs */
        @media screen and (max-width: 768px) {
            input { font-size: 16px !important; }
        }

        .modal-active { display: flex !important; }
    </style>
</head>
<body class="min-h-full flex flex-col pb-10 selection:bg-orange-500 selection:text-white">

    <!-- Header -->
    <nav class="glass sticky top-0 z-50 px-5 pt-[calc(1rem+env(safe-area-inset-top,0px))] pb-4 border-b border-slate-800">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-orange-900/50">S</div>
                <div>
                    <h1 class="text-sm font-black uppercase tracking-wider text-slate-200">Daily Tracker</h1>
                    <p id="current-date" class="text-[11px] font-bold text-slate-400">Loading date...</p>
                </div>
            </div>
            <button onclick="openEditTotal()" class="bg-slate-800 text-slate-200 text-xs font-bold px-3 py-2 rounded-lg border border-slate-700 active:scale-95 transition-transform">
                Edit Total
            </button>
        </div>
    </nav>

    <main class="max-w-md mx-auto px-5 mt-6 space-y-6 w-full flex-1">

        <!-- THE BIG NUMBER -->
        <div class="glass rounded-3xl p-6 text-center shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-orange-500/10 rounded-full blur-3xl"></div>
            
            <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Total Money Left</p>
            
            <div class="flex items-center justify-center gap-1 mb-1">
                <span class="text-slate-400 font-bold text-3xl">R</span>
                <span id="display-total" class="text-5xl font-black text-white tracking-tight">0.00</span>
            </div>
            
            <p id="display-days" class="text-sm font-bold text-orange-400 mt-2">-- days until Payday (Aug 24)</p>

            <!-- TODAY & TOMORROW FORECAST -->
            <div class="mt-5 pt-4 border-t border-slate-800 bg-slate-900/50 -mx-2 px-4 py-3 rounded-2xl space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-300">Today's Budget Left:</span>
                    <span id="display-safe-today" class="text-lg font-black text-white transition-colors">R 0.00</span>
                </div>
                <div class="text-right -mt-1 mb-2">
                    <span id="display-rollover" class="text-[10px] font-bold text-emerald-400">+ R 0.00 saved from past days</span>
                </div>
                
                <div class="flex justify-between items-center border-t border-slate-800/50 pt-2">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Tomorrow's Budget:</span>
                    <span id="display-safe-tomorrow" class="text-sm font-bold text-slate-400">R 0.00</span>
                </div>
            </div>
        </div>

        <!-- LOG EXPENSE -->
        <div class="bg-slate-900 rounded-3xl p-5 border border-slate-800 shadow-xl">
            <label class="text-xs font-black uppercase tracking-wider text-slate-400 block mb-3">Log an Expense</label>
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-lg">R</span>
                    <!-- inputmode decimal & oninput to convert commas to dots instantly -->
                    <input 
                        type="text" 
                        inputmode="decimal" 
                        id="spend-input" 
                        oninput="this.value = this.value.replace(/,/g, '.').replace(/[^0-9.]/g, '')"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl text-white font-black pl-10 pr-4 py-3.5 text-lg focus:outline-none focus:border-orange-500 transition-colors placeholder-slate-600" 
                        placeholder="0.00"
                    >
                </div>
                <button onclick="logExpense()" class="bg-orange-600 hover:bg-orange-500 active:scale-95 text-white font-black px-6 py-3.5 rounded-xl transition-all shadow-lg shadow-orange-900/50">
                    SAVE
                </button>
            </div>
        </div>

        <!-- RECENT EXPENSES LIST -->
        <div>
            <div class="flex justify-between items-center mb-3 px-1">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Recent Expenses</h3>
                <button onclick="openAllTransactionsModal()" class="text-[10px] font-bold text-orange-400 hover:text-orange-300 transition-colors uppercase">View All</button>
            </div>
            <div id="transactions-list" class="space-y-2">
                <!-- Transactions will appear here -->
            </div>
            <button onclick="openAllTransactionsModal()" id="view-all-btn" class="w-full mt-3 bg-slate-900 border border-slate-800 text-slate-400 text-xs font-bold py-3.5 rounded-xl hover:bg-slate-800 transition-colors hidden active:scale-95 shadow-sm">View All Expenses</button>
        </div>

    </main>

    <!-- MODAL: ALL TRANSACTIONS -->
    <div id="transactions-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-[60] items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center shrink-0">
                <h3 class="text-lg font-black text-white">All Expenses</h3>
                <button onclick="closeAllTransactionsModal()" class="text-slate-400 hover:text-white bg-slate-800 rounded-full p-2 transition-colors active:scale-95">
                     <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="all-transactions-list" class="p-6 overflow-y-auto flex-1 space-y-2">
                <!-- All transactions loaded here -->
            </div>
        </div>
    </div>

    <!-- MODAL: EDIT EXPENSE -->
    <div id="edit-expense-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden z-[70] items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-xs w-full shadow-2xl">
            <h3 class="text-lg font-black text-white mb-2">Edit Expense</h3>
            <p class="text-xs text-slate-400 mb-5">Update the amount for this transaction.</p>
            
            <div class="relative mb-5">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-lg">R</span>
                <input 
                    type="text" 
                    inputmode="decimal" 
                    id="modal-edit-expense-input" 
                    oninput="this.value = this.value.replace(/,/g, '.').replace(/[^0-9.]/g, '')"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl text-white font-black pl-10 pr-4 py-3.5 text-lg focus:outline-none focus:border-orange-500 transition-colors"
                >
            </div>
            
            <div class="flex gap-2">
                <button onclick="closeEditExpenseModal()" class="flex-1 bg-slate-800 text-slate-300 font-bold py-3 rounded-xl active:scale-95 transition-transform">Cancel</button>
                <button onclick="saveEditedExpense()" class="flex-1 bg-orange-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-orange-900/50 active:scale-95 transition-transform">Save</button>
            </div>
        </div>
    </div>

    <!-- MODAL: EDIT TOTAL MONEY -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-xs w-full shadow-2xl transform">
            <h3 class="text-lg font-black text-white mb-2">Edit Total Money</h3>
            
            <div class="space-y-4 mb-5">
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2 block">Set exactly how much spending money you have right now.</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-lg">R</span>
                        <input 
                            type="text" 
                            inputmode="decimal" 
                            id="modal-total-input" 
                            oninput="this.value = this.value.replace(/,/g, '.').replace(/[^0-9.]/g, '')"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl text-white font-black pl-10 pr-4 py-3 text-lg focus:outline-none focus:border-orange-500 transition-colors"
                        >
                    </div>
                </div>
                
                <!-- Reset Baseline option so they can clear rollover if they get a fresh paycheck -->
                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="modal-reset-baseline" class="w-4 h-4 accent-orange-600 rounded">
                    <label for="modal-reset-baseline" class="text-xs text-slate-400">Reset daily baseline (clears rollover)</label>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="closeEditTotal()" class="flex-1 bg-slate-800 text-slate-300 font-bold py-3 rounded-xl">Cancel</button>
                <button onclick="saveTotalMoney()" class="flex-1 bg-orange-600 text-white font-bold py-3 rounded-xl">Save</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm font-bold px-5 py-3 rounded-full shadow-2xl transform translate-y-20 opacity-0 transition-all pointer-events-none z-[100] flex items-center gap-2">
        <span class="text-emerald-400">✓</span>
        <span id="toast-msg">Saved!</span>
    </div>

    <script>
        // State
        let state = JSON.parse(localStorage.getItem('ps5_simple_tracker')) || {
            totalMoney: 1811.74,
            baseline: null, // Added to track your fixed daily allowance
            transactions: []
        };

        let editingTxId = null; // Track which transaction is being edited

        // Payday Math (Target: August 24, 2026)
        function getDaysUntilPayday() {
            const now = new Date();
            now.setHours(0, 0, 0, 0); // Strip time so we count full calendar days
            
            const payday = new Date(2026, 7, 24); // Month is 0-indexed (7 = Aug)
            payday.setHours(0, 0, 0, 0);
            
            const diffTime = payday - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            return Math.max(1, diffDays); // Never go below 1 to avoid dividing by zero
        }

        function updateUI() {
            // Update big numbers
            const daysLeft = getDaysUntilPayday();
            
            // Initialize baseline if it doesn't exist
            if (!state.baseline || state.baseline <= 0) {
                state.baseline = state.totalMoney / daysLeft;
            }

            // The Stateless Rollover Math
            const expectedRemaining = daysLeft * state.baseline;
            const totalRollover = state.totalMoney - expectedRemaining;
            const todayBudget = state.baseline + totalRollover;
            
            // Calculate tomorrow's budget (if we don't spend any more today)
            let safeTomorrow = 0;
            if (daysLeft > 1) {
                const tomorrowDays = daysLeft - 1;
                const tomorrowExpected = tomorrowDays * state.baseline;
                const tomorrowRollover = state.totalMoney - tomorrowExpected;
                safeTomorrow = state.baseline + tomorrowRollover;
            }

            document.getElementById('display-total').innerText = state.totalMoney.toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('display-days').innerText = `${daysLeft} days until Payday (Aug 24)`;
            
            // Update Today's Budget UI
            const safeTodayEl = document.getElementById('display-safe-today');
            safeTodayEl.innerText = `R ${todayBudget.toFixed(2)}`;
            if (todayBudget < 0) {
                safeTodayEl.classList.replace('text-white', 'text-red-400');
            } else {
                safeTodayEl.classList.replace('text-red-400', 'text-white');
            }

            // Update Rollover UI
            const rolloverEl = document.getElementById('display-rollover');
            if (totalRollover > 0.01) {
                rolloverEl.innerText = `+ R ${totalRollover.toFixed(2)} saved from past days`;
                rolloverEl.className = "text-[10px] font-bold text-emerald-400";
            } else if (totalRollover < -0.01) {
                rolloverEl.innerText = `- R ${Math.abs(totalRollover).toFixed(2)} overspent from baseline`;
                rolloverEl.className = "text-[10px] font-bold text-red-400";
            } else {
                rolloverEl.innerText = `On track with baseline`;
                rolloverEl.className = "text-[10px] font-bold text-slate-500";
            }
            
            if (daysLeft > 1) {
                document.getElementById('display-safe-tomorrow').innerText = `R ${safeTomorrow.toFixed(2)}`;
            } else {
                document.getElementById('display-safe-tomorrow').innerText = `PAYDAY! 🎉`;
                document.getElementById('display-safe-tomorrow').className = "text-sm font-black text-orange-400";
            }

            // Render transactions on main screen (Top 3)
            const listEl = document.getElementById('transactions-list');
            const viewAllBtn = document.getElementById('view-all-btn');
            listEl.innerHTML = '';

            if (state.transactions.length === 0) {
                listEl.innerHTML = '<p class="text-sm text-slate-500 italic px-1">No recent expenses logged.</p>';
                if(viewAllBtn) viewAllBtn.classList.add('hidden');
            } else {
                // Only show top 3 on the main page
                state.transactions.slice(0, 3).forEach(tx => {
                    listEl.appendChild(createTransactionCard(tx));
                });

                if (state.transactions.length > 3) {
                    if(viewAllBtn) {
                        viewAllBtn.classList.remove('hidden');
                        viewAllBtn.innerText = `View All ${state.transactions.length} Expenses`;
                    }
                } else {
                    if(viewAllBtn) viewAllBtn.classList.add('hidden');
                }
            }
            
            // Update modal list if it's currently open
            renderAllTransactions();

            // Save to storage
            localStorage.setItem('ps5_simple_tracker', JSON.stringify(state));
        }

        function createTransactionCard(tx) {
            const div = document.createElement('div');
            div.className = 'glass rounded-xl p-4 flex justify-between items-center';
            
            const time = new Date(tx.timestamp).toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' });
            const date = new Date(tx.timestamp).toLocaleDateString('en-ZA', { month: 'short', day: 'numeric' });
            
            div.innerHTML = `
                <div>
                    <p class="text-sm font-black text-white">R ${tx.amount.toFixed(2)}</p>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${date} • ${time}</p>
                </div>
                <div class="flex items-center gap-1.5">
                    <button onclick="openEditExpenseModal('${tx.id}')" class="text-slate-400 hover:text-orange-400 bg-slate-900 p-2 rounded-lg transition-colors active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </button>
                    <button onclick="deleteTransaction('${tx.id}')" class="text-slate-400 hover:text-red-400 bg-slate-900 p-2 rounded-lg transition-colors active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            `;
            return div;
        }

        function renderAllTransactions() {
            const listEl = document.getElementById('all-transactions-list');
            if(!listEl) return;
            
            listEl.innerHTML = '';
            
            if (state.transactions.length === 0) {
                listEl.innerHTML = '<p class="text-sm text-slate-500 italic px-1 text-center mt-4">No expenses found.</p>';
                return;
            }
            
            state.transactions.forEach(tx => {
                listEl.appendChild(createTransactionCard(tx));
            });
        }

        function openAllTransactionsModal() {
            document.getElementById('transactions-modal').classList.add('modal-active');
        }

        function closeAllTransactionsModal() {
            document.getElementById('transactions-modal').classList.remove('modal-active');
        }

        function openEditExpenseModal(id) {
            editingTxId = id;
            const tx = state.transactions.find(t => t.id === id);
            if(tx) {
                document.getElementById('modal-edit-expense-input').value = tx.amount.toFixed(2);
                document.getElementById('edit-expense-modal').classList.add('modal-active');
            }
        }

        function closeEditExpenseModal() {
            editingTxId = null;
            document.getElementById('edit-expense-modal').classList.remove('modal-active');
        }

        function saveEditedExpense() {
            if (!editingTxId) return;
            
            const inputVal = parseFloat(document.getElementById('modal-edit-expense-input').value);
            if (isNaN(inputVal) || inputVal < 0) {
                alert("Please enter a valid amount.");
                return;
            }

            const txIndex = state.transactions.findIndex(t => t.id === editingTxId);
            if (txIndex > -1) {
                const oldAmount = state.transactions[txIndex].amount;
                
                // Refund the old amount, then subtract the new amount safely
                state.totalMoney = Math.max(0, state.totalMoney + oldAmount - inputVal);
                
                // Update transaction amount
                state.transactions[txIndex].amount = inputVal;
                
                updateUI();
                closeEditExpenseModal();
                showToast("Expense updated!");
            }
        }

        function logExpense() {
            const input = document.getElementById('spend-input');
            const amount = parseFloat(input.value);

            if (isNaN(amount) || amount < 0) {
                // If it's a 0 spend day, just accept it and clear without deducting
                if (amount === 0) {
                    input.value = '';
                    showToast("No spend day tracked!");
                    return;
                }
                alert("Please enter a valid amount.");
                return;
            }

            // Subtract from total
            state.totalMoney = Math.max(0, state.totalMoney - amount);
            
            // Add to transaction list
            state.transactions.unshift({
                id: Date.now().toString(),
                amount: amount,
                timestamp: new Date().toISOString()
            });

            input.value = '';
            updateUI();
            showToast(`Spent R ${amount.toFixed(2)}`);
        }

        function deleteTransaction(id) {
            const txIndex = state.transactions.findIndex(t => t.id === id);
            if (txIndex > -1) {
                const tx = state.transactions[txIndex];
                
                // Add money back to total
                state.totalMoney += tx.amount;
                
                // Remove from list
                state.transactions.splice(txIndex, 1);
                
                updateUI();
                showToast(`Refunded R ${tx.amount.toFixed(2)}`);
            }
        }

        function openEditTotal() {
            document.getElementById('modal-total-input').value = state.totalMoney.toFixed(2);
            document.getElementById('edit-modal').classList.add('modal-active');
        }

        function closeEditTotal() {
            document.getElementById('edit-modal').classList.remove('modal-active');
        }

        function saveTotalMoney() {
            const val = parseFloat(document.getElementById('modal-total-input').value);
            const resetBaseline = document.getElementById('modal-reset-baseline').checked;
            
            if (!isNaN(val) && val >= 0) {
                state.totalMoney = val;
                
                // If you got a new paycheck or want a fresh start, checking the box recalculates your baseline
                if (resetBaseline) {
                    const daysLeft = getDaysUntilPayday();
                    state.baseline = state.totalMoney / daysLeft;
                }
                
                updateUI();
                closeEditTotal();
                showToast("Total updated!");
                document.getElementById('modal-reset-baseline').checked = false;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
        }

        // Setup Date
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-date').innerText = now.toLocaleDateString('en-ZA', { weekday: 'long', day: 'numeric', month: 'short' });
        }, 1000);

        // Initial Load
        window.onload = updateUI;

    </script>
</body>
</html>
